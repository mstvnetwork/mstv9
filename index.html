<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSTV Network Player</title>
  
  <!-- HLS.js Library for streaming .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .player-wrapper {
      width: 100%;
      max-width: 960px;
    }

    .network-title {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Video Player Container */
    #playerContainer {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    #playerContainer video,
    #playerContainer iframe,
    #ytApiPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Spinner */
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin-top: -20px;
      margin-left: -20px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Category & Menu Controls */
    .controls-panel {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .category-btn, .dropdown-btn {
      background-color: #1f1f1f;
      color: #fff;
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .category-btn:hover, .dropdown-btn:hover {
      background-color: #333;
      border-color: #555;
    }

    .category-btn.active {
      background-color: #e50914;
      border-color: #e50914;
    }

    /* Dropdown Submenu */
    .dropdown-container {
      position: relative;
      display: inline-block;
    }

    .live-tv-submenu {
      display: none;
      position: absolute;
      top: 105%;
      left: 0;
      background-color: #1a1a1a;
      min-width: 180px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      border: 1px solid #333;
      z-index: 20;
    }

    .live-tv-submenu.show {
      display: block;
    }

    .live-tv-submenu button {
      width: 100%;
      padding: 10px 15px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #282828;
    }

    .live-tv-submenu button:hover {
      background-color: #333;
      color: #e50914;
    }

    /* Channels / Playlist Section */
    .playlist-section {
      margin-top: 25px;
    }

    .playlist-title {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #aaa;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .channel-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .channel-card:hover {
      background: #252525;
      transform: translateY(-2px);
      border-color: #444;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <h1 id="networkTitle" class="network-title">MSTV Network</h1>

    <!-- Player Window -->
    <div id="playerContainer">
      <div id="loadingSpinner" class="spinner"></div>
    </div>

    <!-- Category Controls -->
    <div class="controls-panel">
      <button class="category-btn active" onclick="switchCategory('apna_tv')">Apna TV</button>
      <button class="category-btn" onclick="switchCategory('youtube')">YouTube</button>

      <!-- Live TV Dropdown Menu -->
      <div class="dropdown-container">
        <button class="dropdown-btn" onclick="toggleLiveTvMenu(event)">Live TV ▾</button>
        <div id="liveTvSubMenu" class="live-tv-submenu">
          <button onclick="switchCategory('sports')">Sports</button>
          <button onclick="switchCategory('music')">Music</button>
          <button onclick="switchCategory('news')">News</button>
          <button onclick="switchCategory('devotional')">Devotional</button>
          <button onclick="switchCategory('android_pc')">Android / PC</button>
          <button onclick="switchCategory('entertainment')">Entertainment</button>
        </div>
      </div>
    </div>

    <!-- Playlist / Channels List -->
    <div class="playlist-section">
      <h2 class="playlist-title">Available Channels / Streams</h2>
      <div id="channelGrid" class="channel-grid"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // Master JSON Data
    // ==========================================
    const currentData = {
      "network": "MSTV Network",
      "playlists": {
        "apna_tv": [
          {
            "id": 1,
            "title": "Big Buck Bunny Stream",
            "type": "video",
            "duration_seconds": 60,
            "stream_url": "https://ia802800.us.archive.org/33/items/cooking_202602/part_000.ia.mp4?cnt=0"
          },
          {
            "id": 3,
            "title": "Sintel HLS Stream",
            "type": "video",
            "duration_seconds": 60,
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "youtube": [
          {
            "id": 2,
            "title": "MSTV Live Broadcast Feed",
            "type": "iframe",
            "duration_seconds": 60,
            "stream_url": "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=1&enablejsapi=1"
          }
        ]
      },
      "live_tv": {
        "sports": [
          {
            "id": 101,
            "title": "Sports HD Live",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "music": [
          {
            "id": 201,
            "title": "Music Hits TV",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "news": [
          {
            "id": 301,
            "title": "24/7 Global News",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "devotional": [
          {
            "id": 401,
            "title": "Devotional Stream",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "android_pc": [
          {
            "id": 501,
            "title": "Android/PC Stream",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ],
        "entertainment": [
          {
            "id": 601,
            "title": "Entertainment TV",
            "type": "video",
            "stream_url": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          }
        ]
      }
    };

    // Global state variables
    let ytPlayer = null;
    let maxWatchedTime = 0;
    let ytCheckInterval = null;
    let hls = null;
    let isMuted = false;

    // Spinner Utility Helpers
    function showSpinner() {
      const spinner = document.getElementById('loadingSpinner');
      if (spinner) spinner.style.display = 'block';
    }

    function hideSpinner() {
      const spinner = document.getElementById('loadingSpinner');
      if (spinner) spinner.style.display = 'none';
    }

    // Close Dropdown Menu on outside clicks
    document.addEventListener('click', () => {
      const liveTvSubMenu = document.getElementById('liveTvSubMenu');
      if (liveTvSubMenu && liveTvSubMenu.classList.contains('show')) {
        liveTvSubMenu.classList.remove('show');
      }
    });

    // ----------------------------------------
    // 1. Live TV Dropdown Handler
    // ----------------------------------------
    window.toggleLiveTvMenu = function(event) {
      if (event) event.stopPropagation();

      const liveTvSubMenu = document.getElementById('liveTvSubMenu');
      if (liveTvSubMenu) {
        liveTvSubMenu.classList.toggle('show');
      }
    };

    // ----------------------------------------
    // 2. Category Switcher Logic
    // ----------------------------------------
    window.switchCategory = function(categoryKey) {
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      if (window.event && window.event.currentTarget && window.event.currentTarget.classList.contains('category-btn')) {
        window.event.currentTarget.classList.add('active');
      }

      let itemsToRender = null;

      if (currentData.playlists && currentData.playlists[categoryKey]) {
        itemsToRender = currentData.playlists[categoryKey];
      } else if (currentData.live_tv && currentData.live_tv[categoryKey]) {
        itemsToRender = currentData.live_tv[categoryKey];
      }

      if (itemsToRender && itemsToRender.length > 0) {
        renderPlaylist(itemsToRender);
        loadMedia(itemsToRender[0], 0);
      }
    };

    // Render Grid Cards for Channels
    function renderPlaylist(items) {
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = '';

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerText = item.title;
        card.onclick = () => loadMedia(item, 0);
        grid.appendChild(card);
      });
    }

    // ----------------------------------------
    // 3. Memory & Player Cleanup
    // ----------------------------------------
    function cleanupPlayers() {
      if (ytCheckInterval) {
        clearInterval(ytCheckInterval);
        ytCheckInterval = null;
      }

      if (hls) {
        try {
          hls.stopLoad();
          hls.detachMedia();
          hls.destroy();
        } catch (e) {
          console.warn('HLS cleanup warning:', e);
        }
        hls = null;
      }

      if (ytPlayer) {
        if (typeof ytPlayer.destroy === 'function') {
          try {
            ytPlayer.destroy();
          } catch (e) {
            console.warn('YouTube cleanup warning:', e);
          }
        }
        ytPlayer = null;
      }
    }

    // ----------------------------------------
    // 4. Main Media Loader
    // ----------------------------------------
// State tracking variables for forward-skip prevention
let ytPlayer = null;
let maxWatchedTime = 0;
let ytCheckInterval = null;

// Load YouTube API script once dynamically
if (!window.YT) {
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
}

function loadMedia(item, startTime) {
  showSpinner();

  // Reset tracking state
  maxWatchedTime = 0;
  if (ytCheckInterval) clearInterval(ytCheckInterval);

  // Clean up previous HLS instance
  if (hls) {
    hls.stopLoad();
    hls.detachMedia();
    hls.destroy();
    hls = null;
  }

  // Clean up previous YouTube player instance
  if (ytPlayer && typeof ytPlayer.destroy === 'function') {
    ytPlayer.destroy();
    ytPlayer = null;
  }

  container.innerHTML = '';

  if (item.type === 'iframe') {
    // Extract video ID from URL
    const videoIdMatch = item.stream_url.match(/(?:embed\/|v=)([^&?]+)/);
    const videoId = videoIdMatch ? videoIdMatch[1] : null;

    if (videoId) {
      // Create a target div for YouTube API
      const playerDiv = document.createElement('div');
      playerDiv.id = 'ytApiPlayer';
      container.appendChild(playerDiv);

      // Initialize YouTube Player via API
      ytPlayer = new YT.Player('ytApiPlayer', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 1,       // Show controls so user can see scrub bar
          modestbranding: 1,
          rel: 0,
          enablejsapi: 1,
          mute: isMuted ? 1 : 0
        },
        events: {
          onReady: (event) => {
            hideSpinner();
            event.target.playVideo();
            startSkipPreventionMonitor();
          },
          onStateChange: (event) => {
            // Unmute/Mute synchronization if needed
            if (event.data === YT.PlayerState.PLAYING) {
              hideSpinner();
            }
          }
        }
      });
    } else {
      // Fallback for non-YouTube embedded iframes
      const iframe = document.createElement('iframe');
      iframe.src = item.stream_url;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.onload = () => hideSpinner();
      container.appendChild(iframe);
    }

  } else {
    // Standard HTML5 / HLS Video Logic
    const video = document.createElement('video');
    video.autoplay = true;
    video.muted = isMuted;
    video.playsInline = true;
    video.preload = 'auto';

    video.addEventListener('playing', () => hideSpinner());
    video.addEventListener('canplay', () => video.play().catch(() => {}));

    container.appendChild(video);

    // Skip prevention for standard HTML5/HLS videos
    video.addEventListener('timeupdate', () => {
      if (video.currentTime > maxWatchedTime + 2) {
        // User skipped forward -> revert back
        video.currentTime = maxWatchedTime;
      } else {
        // Normal playback -> continuously update maximum watched point
        maxWatchedTime = Math.max(maxWatchedTime, video.currentTime);
      }
    });

    if (item.stream_url.includes('.m3u8')) {
      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(item.stream_url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.currentTime = startTime;
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = item.stream_url;
        video.addEventListener('loadedmetadata', () => {
          video.currentTime = startTime;
          video.play().catch(() => {});
        }, { once: true });
      }
    } else {
      video.src = item.stream_url;
      video.currentTime = startTime;
      video.play().catch(() => {});
    }
  }
}

// Polling interval monitor to block skipping forward
function startSkipPreventionMonitor() {
  ytCheckInterval = setInterval(() => {
    if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
      const currentTime = ytPlayer.getCurrentTime();

      // Detect if user skipped forward by more than 2 seconds past max watched time
      if (currentTime > maxWatchedTime + 2) {
        // Revert back to max watched timestamp
        ytPlayer.seekTo(maxWatchedTime, true);
      } else {
        // Normal continuous playback: track furthest time reached
        maxWatchedTime = Math.max(maxWatchedTime, currentTime);
      }
    }
  }, 250); // Checks 4 times per second
}
          

    // ----------------------------------------
    // 5. YouTube Forward-Skip Prevention Monitor
    // ----------------------------------------
    function startSkipPreventionMonitor() {
      ytCheckInterval = setInterval(() => {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
          const currentTime = ytPlayer.getCurrentTime();
          if (currentTime > maxWatchedTime + 2) {
            ytPlayer.seekTo(maxWatchedTime, true);
          } else {
            maxWatchedTime = Math.max(maxWatchedTime, currentTime);
          }
        }
      }, 500);
    }

    // Initial Load On Page Ready
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('networkTitle').innerText = currentData.network;
      switchCategory('apna_tv');
    });
  </script>
</body>
</html>
