<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSTV Network - Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100vh;
            background-color: #0f0f0f; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #111111, #1f1f1f);
            border-bottom: 2px solid #FFD700;
            display: flex; justify-content: center;
        }
        .logo-area { font-size: 1.6rem; font-weight: 800; color: #FFD700; }
        
        .video-stage-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-color: #000; position: relative;
        }
        .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background-color: black; }
        #videoContainer { width: 100%; height: 100%; }

        /* EPG Scrolling Text Banner below container */
        .epg-ticker-container {
            background-color: #1a1a1a;
            color: #FFD700;
            padding: 8px 12px;
            font-size: 0.9rem;
            border-top: 1px solid #282828;
            border-bottom: 1px solid #282828;
            overflow: hidden;
            white-space: nowrap;
        }
        .epg-ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: tickerScroll 25s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        /* Category Section */
        .categories-nav-wrapper { background-color: #141414; padding: 15px; border-top: 1px solid #282828; }
        .category-buttons-container { display: flex; justify-content: center; gap: 20px; }
        .cat-btn {
            background: #262626; color: #fff; border: 1px solid #3d3d3d;
            padding: 10px 25px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        .cat-btn:hover { background: #FFD700; color: #000; }

        .collapsible-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .collapsible-drawer.open { max-height: 140px; border: 1px solid #333; margin-top: 10px; }
        .channels-scroll-row { display: flex; gap: 12px; padding: 12px; overflow-x: auto; }

        footer {
            background-color: #050505; color: #666;
            padding: 10px; text-align: center; font-size: 0.7rem;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

  <header>
    <div class="logo-area">MSTV NETWORK</div>
  </header>

  <div class="video-stage-container">
    <div class="video-wrapper">
      <div id="videoContainer">
        <video id="videoElement" autoplay playsinline controls style="width:100%; height:100%; display:none;"></video>
        <iframe id="iframeElement" style="width:100%; height:100%; border:none; display:none;"></iframe>
      </div>
    </div>
  </div>

  <!-- EPG Scrolling Text Banner below media container -->
  <div class="epg-ticker-container">
    <div class="epg-ticker-text" id="epgTickerText">Loading EPG Schedule...</div>
  </div>
    
  <div class="categories-nav-wrapper">
    <div class="category-buttons-container">
      <button class="cat-btn" id="apnaDirectBtn"><i class="fa-solid fa-tv"></i> Apna Tv</button>
      <button class="cat-btn" id="youtubeDirectBtn"><i class="fa-brands fa-youtube"></i> You Tube</button>
      <button class="cat-btn" id="liveTvToggle"><i class="fa-solid fa-signal"></i> Live Tv</button>
    </div>

    <div id="liveTvDrawer" class="collapsible-drawer">
      <div class="channels-scroll-row" id="liveTvChannelsList"></div>
    </div>
  </div>

  <footer>
    &copy; MSTV Network. All rights reserved. | Disclaimer: Educational use only.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // --- Core Playback Engine Variables & States ---
    let channelsData = [];
    let youtubeLiveList = [];
    let manualOverrideActive = false;
    let hls = null;

    const videoElement = document.getElementById('videoElement');
    const iframeElement = document.getElementById('iframeElement');
    const epgTickerText = document.getElementById('epgTickerText');

    // --- Core Media Loader Engine ---
    function loadMedia(url, type, index = 0, channelObj = null) {
      collapseAllDrawers();
      
      if (type === 'iframe') {
        if (hls) { hls.destroy(); hls = null; }
        videoElement.pause();
        videoElement.style.display = 'none';
        iframeElement.style.display = 'block';
        iframeElement.src = url;
      } else {
        iframeElement.style.display = 'none';
        iframeElement.src = '';
        videoElement.style.display = 'block';

        if (url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            if (hls) { hls.destroy(); }
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(videoElement);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              videoElement.play().catch(e => console.log("Autoplay blocked:", e));
            });
          } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = url;
            videoElement.addEventListener('loadedmetadata', () => {
              videoElement.play().catch(e => console.log("Autoplay blocked:", e));
            });
          }
        } else {
          if (hls) { hls.destroy(); hls = null; }
          videoElement.src = url;
          videoElement.play().catch(e => console.log("Autoplay blocked:", e));
        }
      }

      // Update EPG/Ticker info if channel object contains it
      if (channelObj && channelObj.epg) {
        epgTickerText.textContent = channelObj.epg;
      }
    }

    // --- Sync Playback (Default/Apna TV Handler) ---
    function syncPlayback() {
      if (channelsData.length > 0 && !manualOverrideActive) {
        loadMedia(channelsData[0].url, channelsData[0].type || 'video', 0, channelsData[0]);
      }
    }

    // --- JSON Data Fetch Engine (Updated to test.json) ---
    async function fetchScheduleAndChannels() {
      try {
        const response = await fetch('test.json');
        const data = await response.json();
        
        // Flexible data mapping to catch standard key configurations
        channelsData = data.channels || data.apnaTv || data.apnatv || [];
        youtubeLiveList = data.youtube || data.youtubelive || [];

        // Populate Live TV Drawer List dynamically
        const liveTvChannelsList = document.getElementById('liveTvChannelsList');
        liveTvChannelsList.innerHTML = '';
        
        const liveTvArray = data.liveTv || data.livetv || [];
        if (Array.isArray(liveTvArray)) {
          liveTvArray.forEach((ch, idx) => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.style.whiteSpace = 'nowrap';
            btn.innerHTML = `<i class="fa-solid fa-play"></i> ${ch.name || 'Channel ' + (idx + 1)}`;
            btn.onclick = () => {
              manualOverrideActive = true;
              loadMedia(ch.url, ch.type || 'video', idx, ch);
            };
            liveTvChannelsList.appendChild(btn);
          });
        }

        // Set initial schedule text ticker if available in test.json
        if (data.epgTicker || data.epg) {
          epgTickerText.textContent = data.epgTicker || data.epg;
        }

        // Trigger default playback sync
        syncPlayback();
      } catch (error) {
        console.error("Error loading test.json feed:", error);
        epgTickerText.textContent = "Error loading schedule data from test.json.";
      }
    }

    // --- Event Listeners Setup ---
    document.getElementById('apnaDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      manualOverrideActive = false;
      if (channelsData.length > 0) {
        loadMedia(channelsData[0].url, channelsData[0].type || 'video', 0, channelsData[0]);
      }
    });

    document.getElementById('youtubeDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      if (youtubeLiveList.length > 0) {
        manualOverrideActive = true;
        loadMedia(youtubeLiveList[0].url, 'iframe', 0, youtubeLiveList[0]);
      } else {
        console.warn("No YouTube stream configured in test.json.");
      }
    });

    const liveTvBtn = document.getElementById('liveTvToggle');
    const liveTvDrawer = document.getElementById('liveTvDrawer');
    liveTvBtn.addEventListener('click', () => {
      liveTvDrawer.classList.toggle('open');
    });

    function collapseAllDrawers() {
      liveTvDrawer.classList.remove('open');
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      fetchScheduleAndChannels();
    });
  </script>
</body>
</html>
