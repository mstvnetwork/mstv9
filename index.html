<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSTV Network - Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100vh;
            background-color: #0f0f0f; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #111111, #1f1f1f);
            border-bottom: 2px solid #FFD700;
            display: flex; justify-content: center;
        }
        .logo-area { font-size: 1.6rem; font-weight: 800; color: #FFD700; }
        
        .video-stage-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-color: #000; position: relative;
        }
        .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background-color: black; }
        #videoContainer { width: 100%; height: 100%; position: relative; }

        /* EPG Scrolling Text Banner below container */
        .epg-ticker-container {
            background-color: #1a1a1a;
            color: #FFD700;
            padding: 8px 12px;
            font-size: 0.9rem;
            border-top: 1px solid #282828;
            border-bottom: 1px solid #282828;
            overflow: hidden;
            white-space: nowrap;
        }
        .epg-ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: tickerScroll 25s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        /* Category Section */
        .categories-nav-wrapper { background-color: #141414; padding: 15px; border-top: 1px solid #282828; }
        .category-buttons-container { display: flex; justify-content: center; gap: 20px; }
        .cat-btn {
            background: #262626; color: #fff; border: 1px solid #3d3d3d;
            padding: 10px 25px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        .cat-btn:hover { background: #FFD700; color: #000; }

        .collapsible-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .collapsible-drawer.open { max-height: 140px; border: 1px solid #333; margin-top: 10px; }
        .channels-scroll-row { display: flex; gap: 12px; padding: 12px; overflow-x: auto; }

        footer {
            background-color: #050505; color: #666;
            padding: 10px; text-align: center; font-size: 0.7rem;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

  <header>
    <div class="logo-area">MSTV NETWORK</div>
  </header>

  <div class="video-stage-container">
    <div class="video-wrapper">
      <div id="videoContainer">
        <video id="videoElement" autoplay playsinline controls style="width:100%; height:100%; display:none; object-fit:contain;"></video>
        <iframe id="iframeElement" style="width:100%; height:100%; border:none; display:none;" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- EPG Scrolling Text Banner below media container -->
  <div class="epg-ticker-container">
    <div class="epg-ticker-text" id="epgTickerText">Loading EPG Schedule...</div>
  </div>
    
  <div class="categories-nav-wrapper">
    <div class="category-buttons-container">
      <button class="cat-btn" id="apnaDirectBtn"><i class="fa-solid fa-tv"></i> Apna Tv</button>
      <button class="cat-btn" id="youtubeDirectBtn"><i class="fa-brands fa-youtube"></i> You Tube</button>
      <button class="cat-btn" id="liveTvToggle"><i class="fa-solid fa-signal"></i> Live Tv</button>
    </div>

    <div id="liveTvDrawer" class="collapsible-drawer">
      <div class="channels-scroll-row" id="liveTvChannelsList"></div>
    </div>
  </div>

  <footer>
    &copy; MSTV Network. All rights reserved. | Disclaimer: Educational use only.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    let rawAppData = {};
    let manualOverrideActive = false;
    let hls = null;

    const videoElement = document.getElementById('videoElement');
    const iframeElement = document.getElementById('iframeElement');
    const epgTickerText = document.getElementById('epgTickerText');

    // Safe media loader matching core engine architecture
    function loadMedia(url, type, channelObj = null) {
      collapseAllDrawers();

      if (!url) {
        console.warn("Attempted to load empty media URL");
        return;
      }

      // Check if YouTube link needs formatting into embed format if raw watch URL is given
      let targetUrl = url;
      if (type === 'iframe' || url.includes('youtube.com') || url.includes('youtu.be')) {
        type = 'iframe';
        if (url.includes('watch?v=')) {
          targetUrl = url.replace('watch?v=', 'embed/');
        } else if (url.includes('youtu.be/')) {
          targetUrl = url.replace('youtu.be/', 'www.youtube.com/embed/');
        }
      }

      if (type === 'iframe') {
        if (hls) { hls.destroy(); hls = null; }
        videoElement.pause();
        videoElement.removeAttribute('src');
        videoElement.load();
        videoElement.style.display = 'none';
        
        iframeElement.style.display = 'block';
        iframeElement.src = targetUrl;
      } else {
        iframeElement.style.display = 'none';
        iframeElement.src = '';
        videoElement.style.display = 'block';

        if (targetUrl.includes('.m3u8')) {
          if (Hls.isSupported()) {
            if (hls) { hls.destroy(); }
            hls = new Hls();
            hls.loadSource(targetUrl);
            hls.attachMedia(videoElement);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              videoElement.play().catch(e => console.log("Autoplay restriction caught:", e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) {
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    hls.destroy();
                    break;
                }
              }
            });
          } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = targetUrl;
            videoElement.addEventListener('loadedmetadata', () => {
              videoElement.play().catch(e => console.log("Autoplay restriction caught:", e));
            });
          }
        } else {
          if (hls) { hls.destroy(); hls = null; }
          videoElement.src = targetUrl;
          videoElement.play().catch(e => console.log("Autoplay restriction caught:", e));
        }
      }

      if (channelObj && (channelObj.epg || channelObj.description)) {
        epgTickerText.textContent = channelObj.epg || channelObj.description;
      }
    }

    function syncPlayback() {
      if (!manualOverrideActive) {
        const apnaSource = rawAppData.apnaTv || rawAppData.apnatv || rawAppData.channels;
        if (Array.isArray(apnaSource) && apnaSource.length > 0) {
          loadMedia(apnaSource[0].url, apnaSource[0].type || 'video', apnaSource[0]);
        } else if (apnaSource && typeof apnaSource === 'object' && apnaSource.url) {
          loadMedia(apnaSource.url, apnaSource.type || 'video', apnaSource);
        }
      }
    }

    async function fetchScheduleAndChannels() {
      try {
        const response = await fetch('test.json');
        rawAppData = await response.json();

        // Populate Live TV Drawer List dynamically
        const liveTvChannelsList = document.getElementById('liveTvChannelsList');
        liveTvChannelsList.innerHTML = '';
        
        const liveTvArray = rawAppData.liveTv || rawAppData.livetv || [];
        if (Array.isArray(liveTvArray)) {
          liveTvArray.forEach((ch, idx) => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.style.whiteSpace = 'nowrap';
            btn.innerHTML = `<i class="fa-solid fa-play"></i> ${ch.name || 'Channel ' + (idx + 1)}`;
            btn.onclick = () => {
              manualOverrideActive = true;
              loadMedia(ch.url, ch.type || 'video', ch);
            };
            liveTvChannelsList.appendChild(btn);
          });
        }

        if (rawAppData.epgTicker || rawAppData.epg) {
          epgTickerText.textContent = rawAppData.epgTicker || rawAppData.epg;
        }

        syncPlayback();
      } catch (error) {
        console.error("Error loading test.json feed:", error);
        epgTickerText.textContent = "Error loading schedule data from test.json.";
      }
    }

    // Category button direct action triggers
    document.getElementById('apnaDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      manualOverrideActive = false;
      syncPlayback();
    });

    document.getElementById('youtubeDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      manualOverrideActive = true;
      const ytSource = rawAppData.youtube || rawAppData.youtubelive;
      if (Array.isArray(ytSource) && ytSource.length > 0) {
        loadMedia(ytSource[0].url, 'iframe', ytSource[0]);
      } else if (ytSource && ytSource.url) {
        loadMedia(ytSource.url, 'iframe', ytSource);
      } else {
        console.warn("No valid YouTube stream found in test.json.");
      }
    });

    const liveTvBtn = document.getElementById('liveTvToggle');
    const liveTvDrawer = document.getElementById('liveTvDrawer');
    liveTvBtn.addEventListener('click', () => {
      liveTvDrawer.classList.toggle('open');
    });

    function collapseAllDrawers() {
      liveTvDrawer.classList.remove('open');
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchScheduleAndChannels();
    });
  </script>
</body>
</html>
