<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="MSTV Network offers 24/7 live TV streams, music, and movies.">
    <meta name="robots" content="index, follow">

    <title>MSTV Network - Live Player</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Analytics -->
    <script data-goatcounter="https://mstv.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <!-- Put this ONCE in your HTML <head> or at the bottom of <body> -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
      :root {
        --bg-main: #0a0c10;
        --card-bg: rgba(22, 27, 34, 0.85);
        --accent-gold: #ffd700;
        --accent-red: #ff3b30;
        --accent-blue: #007aff;
        --text-primary: #ffffff;
        --text-muted: #8b949e;
        --border-color: rgba(255, 255, 255, 0.12);
        --app-height: 100vh; 
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: var(--app-height);
        overflow: hidden;
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: var(--app-height);
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: calc(0.4rem + env(safe-area-inset-top)) calc(0.4rem + env(safe-area-inset-right)) calc(0.4rem + env(safe-area-inset-bottom)) calc(0.4rem + env(safe-area-inset-left));
        gap: 0.4rem;
        position: relative;
      }

      /* Compact Header */
      header.app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.35rem 0.8rem;
        flex-shrink: 0;
      }

      .brand-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .brand-title {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 59, 48, 0.15);
        color: var(--accent-red);
        border: 1px solid rgba(255, 59, 48, 0.3);
        padding: 2px 6px;
        border-radius: 12px;
        font-size: 0.65rem;
        font-weight: 700;
      }

      .live-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-red);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* Player Section */
      .player-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        width: 100%;
        position: relative;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: calc(100vh * (16 / 9));
        aspect-ratio: 16 / 9;
        background-color: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      #videoContainer {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #videoContainer video, 
      #videoContainer iframe {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border: none;
      }

      .yt-shield-full {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: transparent;
        pointer-events: auto;
      }

      .player-placeholder {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #1a202c 0%, #0a0c10 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 20;
        text-align: center;
        padding: 0.8rem;
      }

      .placeholder-icon {
        font-size: 2.2rem;
        color: var(--accent-gold);
        opacity: 0.8;
      }

      .placeholder-text {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .placeholder-subtext {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .player-controls-overlay {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 25;
      }

      .control-btn {
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s ease;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }

      .loading-spinner-overlay {
        position: absolute;
        inset: 0;
        background: rgba(10, 12, 16, 0.85);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 22;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .loading-spinner-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-gold);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spinner-text {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* EPG Ticker */
      .epg-ticker-bar {
        display: flex;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        height: 28px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .epg-label {
        background: var(--accent-gold);
        color: #000;
        font-weight: 700;
        font-size: 0.65rem;
        padding: 0 8px;
        height: 100%;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .ticker-wrapper {
        flex: 1;
        overflow: hidden;
        position: relative;
        white-space: nowrap;
      }

      .ticker-content {
        display: inline-block;
        padding-left: 100%;
        animation: ticker-scroll 20s linear infinite;
        font-size: 0.75rem;
        color: var(--text-primary);
      }

      @keyframes ticker-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      /* Category Switcher Container */
      .category-wrapper {
        position: relative;
        flex-shrink: 0;
        width: 100%;
        z-index: 40;
      }

      .category-container {
        display: flex;
        justify-content: center;
        gap: 6px;
        width: 100%;
      }

      .category-btn {
        flex: 1;
        padding: 6px 8px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.2s ease;
      }

      .category-btn.active {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0.05) 100%);
        border-color: var(--accent-gold);
        color: var(--accent-gold);
      }

      .category-btn.active.youtube {
        background: linear-gradient(135deg, rgba(255, 59, 48, 0.2) 0%, rgba(255, 59, 48, 0.05) 100%);
        border-color: var(--accent-red);
        color: var(--accent-red);
      }

      .category-btn.active.livetv {
        background: linear-gradient(135deg, rgba(0, 122, 255, 0.25) 0%, rgba(0, 122, 255, 0.05) 100%);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
      }

      /* Transparent Collapsible Subcategories Overlay */
      .subcategories-menu {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        margin-bottom: 6px;
        background: rgba(10, 12, 16, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
        max-height: 220px;
        overflow-y: auto;
      }

      .subcategories-menu.active {
        display: block;
      }

      .subcategories-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 6px;
      }

      .subcat-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        padding: 6px;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
      }

      .subcat-btn:hover, .subcat-btn.active {
        background: rgba(0, 122, 255, 0.2);
        border-color: var(--accent-blue);
        color: #fff;
      }

      /* Collapsible Channel List */
      .channels-list {
        display: none;
        grid-column: 1 / -1;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        padding: 6px;
        gap: 4px;
        margin-top: 4px;
        max-height: 120px;
        overflow-y: auto;
      }

      .channels-list.active {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }

      .channel-item {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        cursor: pointer;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        text-align: left;
      }

      .channel-item:hover {
        background: var(--accent-gold);
        color: #000;
        font-weight: 700;
      }

      /* Footer */
      footer.app-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font-size: 0.65rem;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .footer-links {
        display: flex;
        gap: 0.6rem;
      }

      .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
      }

      .footer-links a:hover {
        color: var(--accent-gold);
      }

      @media (max-height: 500px) {
        .app-header, footer.app-footer { padding: 0.2rem 0.5rem; }
        .brand-title { font-size: 0.85rem; }
        .placeholder-icon { font-size: 1.5rem; }
        .placeholder-text { font-size: 0.8rem; }
        .category-btn { padding: 4px 6px; font-size: 0.72rem; }
        .subcategories-menu { max-height: 150px; }
      }
    </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- Header -->
    <header class="app-header">
      <div class="brand-box">
        <i class="fa-solid fa-satellite-dish" style="color: var(--accent-gold);"></i>
        <span class="brand-title">MSTV NETWORK</span>
      </div>
      <div class="header-right">
        <div class="live-badge">
          <span class="live-dot"></span> LIVE
        </div>
        <span id="currentTime">00:00</span>
      </div>
    </header>

    <!-- 16:9 Media Player Container -->
    <main class="player-section">
      <div class="video-wrapper" id="playerWrapper">
        <div id="videoContainer"></div>

        <div class="player-placeholder" id="playerPlaceholder">
          <i class="fa-solid fa-circle-play placeholder-icon"></i>
          <div class="placeholder-text">Welcome to MSTV Live Network</div>
          <div class="placeholder-subtext">Select a category below to begin playback</div>
        </div>

        <div class="player-controls-overlay">
          <button class="control-btn" id="muteToggle" title="Toggle Mute">
            <i class="fa-solid fa-volume-xmark"></i>
          </button>
          <button class="control-btn" id="fullscreenToggle" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>

        <div class="loading-spinner-overlay" id="loadingSpinner">
          <div class="spinner"></div>
          <span class="spinner-text">Loading Stream...</span>
        </div>
      </div>
    </main>

    <!-- EPG Ticker -->
    <div class="epg-ticker-bar">
      <div class="epg-label"><i class="fa-solid fa-tv" style="margin-right: 4px;"></i> EPG</div>
      <div class="ticker-wrapper">
        <div class="ticker-content" id="epgTickerText">
          Please select a playlist category to view current broadcast schedule.
        </div>
      </div>
    </div>

    <!-- Category Tabs & Subcategories Wrapper -->
    <div class="category-wrapper">
      
      <!-- Transparent Collapsible Subcategories Menu -->
      <div class="subcategories-menu" id="subcategoriesMenu">
        <div class="subcategories-grid" id="subcategoriesGrid"></div>
      </div>

      <!-- Main Category Tabs -->
      <nav class="category-container">
        <button class="category-btn" id="btnApnaTv" onclick="switchCategory('apna_tv')">
          <i class="fa-solid fa-play"></i> Apna TV
        </button>
        <button class="category-btn" id="btnYouTube" onclick="switchCategory('youtube')">
          <i class="fa-brands fa-youtube"></i> YouTube
        </button>
        <button class="category-btn" id="btnLiveTv" onclick="toggleLiveTvMenu()">
          <i class="fa-solid fa-tv"></i> Live TV
        </button>
      </nav>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <div>© 2026 MSTV INDIA. All rights reserved.</div>
      <div class="footer-links">
        <a href="#" onclick="alert('MSTV Network streams public streams without hosting content directly.')">Disclaimer</a>
        <a href="mailto:contact@mstvindia.com">Contact</a>
      </div>
    </footer>

  </div>

  <!-- HLS Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.js"></script>
<script>
    // ==========================================
// MSTV Player Script with YouTube & HLS Handling
// ==========================================

// Global state tracking variables
let ytPlayer = null;
let maxWatchedTime = 0;
let ytCheckInterval = null;
let hls = null;

// Clean up existing players to release CPU/Memory before loading new stream
function cleanupPlayers() {
  // 1. Clear active YouTube monitoring timer
  if (ytCheckInterval) {
    clearInterval(ytCheckInterval);
    ytCheckInterval = null;
  }

  // 2. Clean up HLS instance safely
  if (hls) {
    try {
      hls.stopLoad();
      hls.detachMedia();
      hls.destroy();
    } catch (e) {
      console.warn('HLS cleanup warning:', e);
    }
    hls = null;
  }

  // 3. Clean up YouTube player instance without blocking execution
  if (ytPlayer) {
    if (typeof ytPlayer.destroy === 'function') {
      try {
        ytPlayer.destroy();
      } catch (e) {
        console.warn('YouTube cleanup warning:', e);
      }
    }
    ytPlayer = null;
  }
}

// Main function to load media streams
function loadMedia(item, startTime = 0) {
  showSpinner();
  
  // Clean up existing active players
  cleanupPlayers();
  
  // Sync watch tracking point to initial start position
  maxWatchedTime = startTime;
  container.innerHTML = '';

  // ----------------------------------------
  // OPTION A: YouTube / Embed Iframes
  // ----------------------------------------
  if (item.type === 'iframe') {
    const videoIdMatch = item.stream_url.match(/(?:embed\/|v=)([^&?]+)/);
    const videoId = videoIdMatch ? videoIdMatch[1] : null;

    if (videoId && window.YT && window.YT.Player) {
      const playerDiv = document.createElement('div');
      playerDiv.id = 'ytApiPlayer';
      container.appendChild(playerDiv);

      ytPlayer = new YT.Player('ytApiPlayer', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          enablejsapi: 1,
          mute: isMuted ? 1 : 0
        },
        events: {
          onReady: (event) => {
            hideSpinner();
            event.target.playVideo();
            startSkipPreventionMonitor();
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              hideSpinner();
            }
          }
        }
      });
    } else {
      // Direct iframe fallback
      const iframe = document.createElement('iframe');
      iframe.src = item.stream_url;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.onload = () => hideSpinner();
      container.appendChild(iframe);
    }

  // ----------------------------------------
  // OPTION B: Native Video & HLS (.m3u8 / .mp4)
  // ----------------------------------------
  } else {
    const video = document.createElement('video');
    video.autoplay = true;
    video.muted = isMuted;
    video.playsInline = true;
    video.preload = 'auto';

    // Gate to prevent skip enforcement during initial buffering/seeking
    let isInitialLoading = true;

    video.addEventListener('playing', () => {
      hideSpinner();
      // Enable skip-prevention 500ms after playback smooths out
      setTimeout(() => { isInitialLoading = false; }, 500);
    });

    container.appendChild(video);

    // Skip prevention logic for HTML5/HLS streams
    video.addEventListener('timeupdate', () => {
      if (isInitialLoading || video.seeking || video.paused) return;

      if (video.currentTime > maxWatchedTime + 2) {
        // Revert back if user skips forward past watched point
        video.currentTime = maxWatchedTime;
      } else {
        // Smoothly advance maximum watched position
        maxWatchedTime = Math.max(maxWatchedTime, video.currentTime);
      }
    });

    // Handle HLS streams
    if (item.stream_url.includes('.m3u8')) {
      if (Hls.isSupported()) {
        hls = new Hls({ 
          enableWorker: true, 
          lowLatencyMode: false,          // Off to prevent stuttering on cold start
          capLevelToPlayerSize: true,     // Match stream resolution to player size
          startLevel: -1,                  // Auto adaptive bitrate selection
          maxBufferLength: 30,
          backBufferLength: 15
        });

        hls.loadSource(item.stream_url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (startTime > 0) {
            video.currentTime = startTime;
          }
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari/iOS HLS support
        video.src = item.stream_url;
        video.addEventListener('loadedmetadata', () => {
          if (startTime > 0) video.currentTime = startTime;
          video.play().catch(() => {});
        }, { once: true });
      }
    } else {
      // Standard MP4 stream handling
      video.src = item.stream_url;
      if (startTime > 0) video.currentTime = startTime;
      video.play().catch(() => {});
    }
  }
}

// ----------------------------------------
// YouTube Forward-Skip Prevention Monitor
// ----------------------------------------
function startSkipPreventionMonitor() {
  ytCheckInterval = setInterval(() => {
    if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
      const currentTime = ytPlayer.getCurrentTime();
      
      // If user tries to scrub forward past maximum watched position
      if (currentTime > maxWatchedTime + 2) {
        ytPlayer.seekTo(maxWatchedTime, true);
      } else {
        maxWatchedTime = Math.max(maxWatchedTime, currentTime);
      }
    }
  }, 500); // Polls twice per second for lightweight CPU usage
}
                            
  </script>
</body>
