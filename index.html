<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="MSTV Network offers 24/7 live TV streams, music, and movies.">
    <meta name="robots" content="index, follow">

    <title>MSTV Network - Live Player</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Analytics -->
    <script data-goatcounter="https://mstv.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

    <style>
      :root {
        --bg-main: #0a0c10;
        --card-bg: rgba(22, 27, 34, 0.85);
        --accent-gold: #ffd700;
        --accent-red: #ff3b30;
        --text-primary: #ffffff;
        --text-muted: #8b949e;
        --border-color: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Strict viewport fit */
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* Single-Page Layout Frame */
      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0.25rem;
        gap: 0.25rem; /* Minimal gap between components */
      }

      /* Ultra-Compact Header */
      header.app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.25rem 0.75rem;
        flex-shrink: 0;
      }

      .brand-box {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .brand-title {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 59, 48, 0.15);
        color: var(--accent-red);
        border: 1px solid rgba(255, 59, 48, 0.3);
        padding: 1px 5px;
        border-radius: 10px;
        font-size: 0.65rem;
        font-weight: 700;
      }

      .live-dot {
        width: 5px;
        height: 5px;
        background-color: var(--accent-red);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* Strictly Aspect 16:9 Media Player Container */
      .player-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        width: 100%;
      }

      .video-wrapper {
        position: relative;
        /* Expanded bounds to remove gap with upper and lower UI */
        width: min(100%, calc((100vh - 115px) * (16 / 9)));
        aspect-ratio: 16 / 9;
        max-height: 100%;
        background-color: #000;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }

      #videoContainer {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #videoContainer video, 
      #videoContainer iframe {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border: none;
      }

      /* Full Viewport Transparent Shield */
      .yt-shield-full {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: transparent;
        pointer-events: auto;
      }

      /* Placeholder Overlay on First Visit */
      .player-placeholder {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #1a202c 0%, #0a0c10 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 20;
        text-align: center;
        padding: 0.5rem;
      }

      .placeholder-icon {
        font-size: 2.5rem;
        color: var(--accent-gold);
        opacity: 0.8;
      }

      .placeholder-text {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .placeholder-subtext {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* Controls Overlay */
      .player-controls-overlay {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 25;
      }

      .control-btn {
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.75rem;
        transition: all 0.2s ease;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }

      /* Modern Loading Spinner */
      .loading-spinner-overlay {
        position: absolute;
        inset: 0;
        background: rgba(10, 12, 16, 0.85);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 22;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .loading-spinner-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-gold);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spinner-text {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* Compact EPG Ticker Bar */
      .epg-ticker-bar {
        display: flex;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        height: 26px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .epg-label {
        background: var(--accent-gold);
        color: #000;
        font-weight: 700;
        font-size: 0.65rem;
        padding: 0 8px;
        height: 100%;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .ticker-wrapper {
        flex: 1;
        overflow: hidden;
        position: relative;
        white-space: nowrap;
      }

      .ticker-content {
        display: inline-block;
        padding-left: 100%;
        animation: ticker-scroll 20s linear infinite;
        font-size: 0.75rem;
        color: var(--text-primary);
      }

      @keyframes ticker-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      /* Category Switcher Tabs */
      .category-container {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .category-btn {
        flex: 1;
        max-width: 200px;
        padding: 5px 10px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 5px;
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.2s ease;
      }

      .category-btn.active {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0.05) 100%);
        border-color: var(--accent-gold);
        color: var(--accent-gold);
      }

      .category-btn.active.youtube {
        background: linear-gradient(135deg, rgba(255, 59, 48, 0.2) 0%, rgba(255, 59, 48, 0.05) 100%);
        border-color: var(--accent-red);
        color: var(--accent-red);
      }

      /* Compact Footer */
      footer.app-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        padding: 0.2rem 0.6rem;
        font-size: 0.65rem;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .footer-links {
        display: flex;
        gap: 0.6rem;
      }

      .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
      }

      .footer-links a:hover {
        color: var(--accent-gold);
      }

      @media (max-width: 600px) {
        .app-layout {
          padding: 0.2rem;
          gap: 0.2rem;
        }

        footer.app-footer {
          flex-direction: column;
          gap: 2px;
          text-align: center;
        }
      }
    </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- Header -->
    <header class="app-header">
      <div class="brand-box">
        <i class="fa-solid fa-satellite-dish" style="color: var(--accent-gold);"></i>
        <span class="brand-title">MSTV NETWORK</span>
      </div>
      <div class="header-right">
        <div class="live-badge">
          <span class="live-dot"></span> LIVE
        </div>
        <span id="currentTime">00:00</span>
      </div>
    </header>

    <!-- 16:9 Media Player Container -->
    <main class="player-section">
      <div class="video-wrapper" id="playerWrapper">
        
        <!-- Video / Iframe Viewport -->
        <div id="videoContainer"></div>

        <!-- Initial Visit Placeholder Overlay -->
        <div class="player-placeholder" id="playerPlaceholder">
          <i class="fa-solid fa-circle-play placeholder-icon"></i>
          <div class="placeholder-text">Welcome to MSTV Live Network</div>
          <div class="placeholder-subtext">Select a channel below to begin playback</div>
        </div>

        <!-- Custom Controls -->
        <div class="player-controls-overlay">
          <button class="control-btn" id="muteToggle" title="Toggle Mute">
            <i class="fa-solid fa-volume-xmark"></i>
          </button>
          <button class="control-btn" id="fullscreenToggle" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>

        <!-- Modern Spinner -->
        <div class="loading-spinner-overlay" id="loadingSpinner">
          <div class="spinner"></div>
          <span class="spinner-text">Loading Stream...</span>
        </div>

      </div>
    </main>

    <!-- EPG Ticker -->
    <div class="epg-ticker-bar">
      <div class="epg-label"><i class="fa-solid fa-tv" style="margin-right: 4px;"></i> EPG</div>
      <div class="ticker-wrapper">
        <div class="ticker-content" id="epgTickerText">
          Please select a playlist category to view current broadcast schedule.
        </div>
      </div>
    </div>

    <!-- Category Tabs -->
    <nav class="category-container">
      <button class="category-btn" id="btnApnaTv" onclick="switchCategory('apna_tv')">
        <i class="fa-solid fa-play"></i> Apna TV
      </button>
      <button class="category-btn" id="btnYouTube" onclick="switchCategory('youtube')">
        <i class="fa-brands fa-youtube"></i> YouTube
      </button>
    </nav>

    <!-- Footer -->
    <footer class="app-footer">
      <div>© 2026 MSTV INDIA. All rights reserved.</div>
      <div class="footer-links">
        <a href="#" onclick="alert('MSTV Network streams public streams without hosting content directly.')">Disclaimer</a>
        <a href="mailto:contact@mstvindia.com">Contact</a>
      </div>
    </footer>

  </div>

  <!-- HLS Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.js"></script>

  <script>
    // DOM Elements
    const container = document.getElementById('videoContainer');
    const playerWrapper = document.getElementById('playerWrapper');
    const playerPlaceholder = document.getElementById('playerPlaceholder');
    const muteToggle = document.getElementById('muteToggle');
    const fullscreenToggle = document.getElementById('fullscreenToggle');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const epgTickerText = document.getElementById('epgTickerText');
    const btnApnaTv = document.getElementById('btnApnaTv');
    const btnYouTube = document.getElementById('btnYouTube');
    const currentTimeEl = document.getElementById('currentTime');

    // State Variables
    let rawPlaylists = {};
    let activeCategory = null;
    let currentPlaylist = [];
    let videoDurations = [];
    let totalDuration = 0;
    
    let hls = null;
    let currentIndex = -1;
    let isMuted = true;
    let syncTimer = null;

    // Clock display
    function updateClock() {
      const now = new Date();
      currentTimeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateMuteButtonUI() {
      muteToggle.innerHTML = isMuted 
        ? '<i class="fa-solid fa-volume-xmark"></i>' 
        : '<i class="fa-solid fa-volume-high"></i>';
    }

    function showSpinner() {
      loadingSpinner.classList.add('active');
    }

    function hideSpinner() {
      loadingSpinner.classList.remove('active');
    }

    // Audio & Fullscreen Handlers
    muteToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      updateMuteButtonUI();
      
      const activeVideo = container.querySelector('video');
      if (activeVideo) {
        activeVideo.muted = isMuted;
      }
    });

    fullscreenToggle.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        playerWrapper.requestFullscreen().catch(err => {
          console.error(`Fullscreen error: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Fetch JSON Data
    async function loadData() {
      try {
        const response = await fetch('test.json');
        const data = await response.json();
        rawPlaylists = data.playlists || {};
      } catch (error) {
        console.error('Failed to load test.json:', error);
        epgTickerText.textContent = 'Error loading timetable data.';
      }
    }

    // Category Switching Handler
    function switchCategory(categoryKey) {
      if (!rawPlaylists[categoryKey]) return;

      // Dismiss initial placeholder
      if (playerPlaceholder) {
        playerPlaceholder.style.display = 'none';
      }

      activeCategory = categoryKey;
      currentIndex = -1;

      // Set audio unmuted automatically when YouTube is selected
      if (categoryKey === 'youtube') {
        isMuted = false;
      } else {
        isMuted = true;
      }
      updateMuteButtonUI();

      // Update Tab Styles
      if (categoryKey === 'apna_tv') {
        btnApnaTv.className = 'category-btn active';
        btnYouTube.className = 'category-btn';
      } else {
        btnApnaTv.className = 'category-btn';
        btnYouTube.className = 'category-btn youtube';
      }

      currentPlaylist = rawPlaylists[categoryKey];
      videoDurations = currentPlaylist.map(item => item.duration_seconds || 60);
      totalDuration = videoDurations.reduce((a, b) => a + b, 0);

      // Reset Sync Loop
      if (syncTimer) clearInterval(syncTimer);
      syncPlayback();
      syncTimer = setInterval(syncPlayback, 1000);
    }

    // Position sync
    function getPlaybackPosition() {
      if (totalDuration === 0) return { index: 0, time: 0 };
      const now = Math.floor(Date.now() / 1000) % totalDuration;
      let offset = 0;
      for (let i = 0; i < videoDurations.length; i++) {
        if (now < offset + videoDurations[i]) {
          return { index: i, time: now - offset };
        }
        offset += videoDurations[i];
      }
      return { index: 0, time: 0 };
    }

    // Load Stream Source
    function loadMedia(item, startTime) {
      showSpinner();

      // Explicitly detach and destroy active HLS instance
      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        hls = null;
      }

      container.innerHTML = '';

      if (item.type === 'iframe') {
        let finalUrl = item.stream_url;

        // Apply YouTube embed parameters
        if (finalUrl.includes('youtube.com')) {
          const urlObj = new URL(finalUrl);
          urlObj.searchParams.set('controls', '0');       // Strips controls & scrub bar
          urlObj.searchParams.set('modestbranding', '1'); // Minimizes branding
          urlObj.searchParams.set('rel', '0');            // Restricts recommendations to channel videos
          urlObj.searchParams.set('iv_load_policy', '3'); // Disables pop-up annotations
          urlObj.searchParams.set('enablejsapi', '1');
          
          if (!isMuted) {
            urlObj.searchParams.set('mute', '0');
          } else {
            urlObj.searchParams.set('mute', '1');
          }
          finalUrl = urlObj.toString();
        }

        const iframe = document.createElement('iframe');
        iframe.src = finalUrl;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        
        // Strict anti-redirect sandbox
        iframe.sandbox = "allow-scripts allow-same-origin allow-forms allow-presentation";

        iframe.onload = () => {
          hideSpinner();
        };

        container.appendChild(iframe);

        // Transparent full-view shield
        const shieldFull = document.createElement('div');
        shieldFull.className = 'yt-shield-full';
        container.appendChild(shieldFull);

      } else {
        const video = document.createElement('video');
        video.autoplay = true;
        video.muted = isMuted;
        video.playsInline = true;
        video.preload = 'auto';

        // Immediate play triggering listeners
        video.addEventListener('playing', () => hideSpinner());
        video.addEventListener('canplay', () => {
          video.play().catch(() => {});
        });

        container.appendChild(video);

        if (item.stream_url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(item.stream_url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = item.stream_url;
            video.addEventListener('loadedmetadata', () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            }, { once: true });
          }
        } else {
          video.src = item.stream_url;
          video.currentTime = startTime;
          video.play().catch(() => {});
        }
      }
    }

    // Dynamic EPG Marquee
    function updateEpgTicker(index) {
      if (!currentPlaylist[index]) return;
      const nowPlaying = currentPlaylist[index].title;
      const nextIndex = (index + 1) % currentPlaylist.length;
      const comingNext = currentPlaylist[nextIndex].title;
      
      epgTickerText.textContent = `NOW PLAYING: ${nowPlaying} — COMING NEXT: ${comingNext}`;
    }

    // Sync loop monitor
    function syncPlayback() {
      if (totalDuration === 0 || currentPlaylist.length === 0) return;
      
      const { index, time } = getPlaybackPosition();

      if (index !== currentIndex) {
        currentIndex = index;
        loadMedia(currentPlaylist[index], time);
        updateEpgTicker(index);
        return;
      }

      const activeVideo = container.querySelector('video');
      if (activeVideo && Math.abs(activeVideo.currentTime - time) > 3) {
        activeVideo.currentTime = time;
      }
    }

    // Load data on page init
    loadData();
  </script>
</body>
</html>
