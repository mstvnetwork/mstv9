<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="MSTV Network offers a variety of live TV channels including music, movies, and more. Watch your favorite channels online for free.">
    <meta name="robots" content="index, follow">
  <title>m3u8 player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 20px 10px;
      background-color: #000;
      font-size: 2.5em;
      font-weight: bold;
      color: #FFD700;
    }
    .scrolling-text {
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .top-scrolling-text { background-color: #222; }
    .bottom-scrolling-text { background-color: #004080; }
    .scrolling-text p {
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 15s linear infinite;
      font-size: 1.2em;
      color: #fff;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 1280px;
      margin: 30px auto;
      padding-top: 56.25%;
      background-color: black;
    }
    #videoContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #muteToggle {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white; font-size: 1.5em;
      padding: 5px 10px; border-radius: 50%;
      cursor: pointer; z-index: 10;
    }
    #liveStamp {
      position: absolute;
      top: 10px; left: 10px;
      background-color: red; color: white;
      font-weight: bold; padding: 5px 10px;
      font-size: 0.9em; border-radius: 5px; z-index: 10;
    }
    footer {
      background-color: black; color: yellow;
      padding: 20px 10px; text-align: center; font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>MSTV NETWORK</header>

  <div class="scrolling-text top-scrolling-text">
    <p>Welcome to MSTV Network — Streaming Live 24/7 — Stay Tuned for Exclusive Content and Updates!</p>
  </div>

  <div class="video-wrapper">
    <div id="videoContainer"></div>
    <span id="muteToggle">🔈</span>
    <div id="liveStamp">LIVE</div>
  </div>
    
  <div class="scrolling-text bottom-scrolling-text">
    <p>Loading schedule...</p>
  </div>

  <footer>
    <div class="copyright">© 2025 MSTV INDIA. All rights reserved.</div>
  </footer>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const container = document.getElementById('videoContainer');
    const muteToggle = document.getElementById('muteToggle');
    const bottomScrollText = document.querySelector('.bottom-scrolling-text p');

    let currentUrl = '';
    let currentType = '';
    let currentTimeOffset = 0;

    muteToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      muteToggle.textContent = isMuted ? '🔈' : '🔊';

      // 1. If it's a standard video element, update its mute state directly
      const activeVideo = container.querySelector('video');
      if (activeVideo) {
        activeVideo.muted = isMuted;
        if (!activeVideo.paused) activeVideo.play().catch(() => {});
      }

      // 2. If it's an iframe (like YouTube), re-render it with the new mute parameter
      if (currentType === 'iframe' && currentUrl) {
        loadMedia(currentUrl, currentType, currentTimeOffset);
      }
    });

    // Fetch schedule data (can be called repeatedly for real-time updates)
    async function fetchSchedule(isInitial = false) {
      try {
        // Append a timestamp query string (?t=...) to bypass browser caching of test.json
        const response = await fetch(`test.json?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        if (!data.playlist || data.playlist.length === 0) throw new Error('Playlist is empty');
        
        playlist = data.playlist.map(item => item.stream_url);
        titles = data.playlist.map(item => item.title);
        videoDurations = data.playlist.map(item => item.duration_seconds);
        streamTypes = data.playlist.map(item => item.type || 'video');
        totalDuration = videoDurations.reduce((a, b) => a + b, 0);

        if (isInitial) {
          syncPlayback();
          setInterval(syncPlayback, 1000); // 1-second sync tick for playback positions
        }
      } catch (error) {
        console.error('Failed to fetch test.json:', error);
        if (!isInitialized) {
          bottomScrollText.textContent = 'Error: Could not load test.json schedule configuration.';
        }
      }
    }

    function getPlaybackPosition() {
      if (totalDuration === 0) return { index: 0, time: 0 };
      const now = Math.floor(Date.now() / 1000) % totalDuration;
      let offset = 0;
      for (let i = 0; i < videoDurations.length; i++) {
        if (now < offset + videoDurations[i]) {
          return { index: i, time: now - offset };
        }
        offset += videoDurations[i];
      }
      return { index: 0, time: 0 };
    }
   function loadMedia(url, type, startTime) {
      if (!url) return;
      
      // Save current states for the mute toggle reference
      currentUrl = url;
      currentType = type;
      currentTimeOffset = startTime;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      container.innerHTML = '';

      if (type === 'iframe') {
        const iframe = document.createElement('iframe');
        
        // If it's a YouTube URL, dynamically adjust the 'mute' parameter based on user toggle
        let finalUrl = url;
        if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com')) {
          // Replace or append mute parameter (mute=0 for sound on, mute=1 for sound off)
          const muteVal = isMuted ? '1' : '0';
          if (finalUrl.includes('mute=')) {
            finalUrl = finalUrl.replace(/mute=[01]/, `mute=${muteVal}`);
          } else {
            finalUrl += (finalUrl.includes('?') ? '&' : '?') + `mute=${muteVal}`;
          }
          // Ensure autoplay is active
          if (!finalUrl.includes('autoplay=')) {
            finalUrl += '&autoplay=1';
          }
        }

        iframe.src = finalUrl;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.sandbox = "allow-scripts allow-same-origin allow-presentation";
        
        container.appendChild(iframe);
      } else {
        const video = document.createElement('video');
        video.id = 'videoPlayer';
        video.autoplay = true;
        video.muted = isMuted;
        video.playsInline = true;
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'cover';
        video.style.pointerEvents = 'none';
        video.style.userSelect = 'none';

        container.appendChild(video);

        if (url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            }, { once: true });
          }
        } else {
          video.src = url;
          video.currentTime = startTime;
          video.play().catch(() => {});
        }
      }
   }
    
      else {
        const video = document.createElement('video');
        video.id = 'videoPlayer';
        video.autoplay = true;
        video.muted = isMuted;
        video.playsInline = true;
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'cover';
        video.style.pointerEvents = 'none';
        video.style.userSelect = 'none';

        container.appendChild(video);

        if (url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => {
              video.currentTime = startTime;
              video.play().catch(() => {});
            }, { once: true });
          }
        } else {
          video.src = url;
          video.currentTime = startTime;
          video.play().catch(() => {});
        }
      }
    }

    function updateBottomScrollText(index) {
      const nowPlaying = titles[index] || "Unknown";
      const comingNext = titles[(index + 1) % titles.length] || "Unknown";
      bottomScrollText.textContent = `Now Playing: ${nowPlaying} — Coming Next: ${comingNext}`;
    }

    function syncPlayback() {
      if (totalDuration === 0) return;
      const { index, time } = getPlaybackPosition();

      if (index !== currentIndex) {
        currentIndex = index;
        loadMedia(playlist[index], streamTypes[index], time);
        updateBottomScrollText(index);
        return;
      }

      const activeVideo = container.querySelector('video');
      if (activeVideo && Math.abs(activeVideo.currentTime - time) > 3) {
        activeVideo.currentTime = time;
      }
    }

    // Start player initially
    async function initPlayer() {
      await fetchSchedule(true);
      isInitialized = true;

      // Periodically re-fetch test.json in the background every 10 seconds for real-time updates
      setInterval(() => {
        fetchSchedule(false);
      }, 10000);
    }

    initPlayer();
  </script>
</body>
</html>
