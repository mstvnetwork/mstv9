<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSTV Network - Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100vh;
            background-color: #0f0f0f; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #111111, #1f1f1f);
            border-bottom: 2px solid #FFD700;
            display: flex; justify-content: center;
        }
        .logo-area { font-size: 1.6rem; font-weight: 800; color: #FFD700; }
        
        .video-stage-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-color: #000; position: relative;
        }
        .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background-color: black; }
        #videoContainer { width: 100%; height: 100%; }
        
        /* Category Section */
        .categories-nav-wrapper { background-color: #141414; padding: 15px; border-top: 1px solid #282828; }
        .category-buttons-container { display: flex; justify-content: center; gap: 20px; }
        .cat-btn {
            background: #262626; color: #fff; border: 1px solid #3d3d3d;
            padding: 10px 25px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        .cat-btn:hover { background: #FFD700; color: #000; }

        .collapsible-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .collapsible-drawer.open { max-height: 140px; border: 1px solid #333; margin-top: 10px; }
        .channels-scroll-row { display: flex; gap: 12px; padding: 12px; overflow-x: auto; }

        footer {
            background-color: #050505; color: #666;
            padding: 15px; text-align: center; font-size: 0.75rem;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

  <header>
    <div class="logo-area">MSTV NETWORK</div>
  </header>

  <div class="video-stage-container">
    <div class="video-wrapper">
      <div id="videoContainer">
        <video id="videoElement" autoplay playsinline style="width:100%; height:100%; display:none;"></video>
        <iframe id="iframeElement" style="width:100%; height:100%; border:none; display:none;"></iframe>
      </div>
    </div>
  </div>
    
  <div class="categories-nav-wrapper">
    <div class="category-buttons-container">
      <button class="cat-btn" id="apnaDirectBtn"><i class="fa-solid fa-tv"></i> Apna Tv</button>
      <button class="cat-btn" id="youtubeDirectBtn"><i class="fa-brands fa-youtube"></i> You Tube</button>
      <button class="cat-btn" id="liveTvToggle"><i class="fa-solid fa-signal"></i> Live Tv</button>
    </div>

    <div id="liveTvDrawer" class="collapsible-drawer">
      <div class="channels-scroll-row" id="liveTvChannelsList"></div>
    </div>
  </div>

  <footer>
    © 2026 MSTV India. All rights reserved. | Disclaimer: We do not host any stream. All content is for educational purposes.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // ... (Keep existing video logic variables)
    
    // Updated Logic
    document.getElementById('apnaDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      manualOverrideActive = false;
      syncPlayback();
    });

    document.getElementById('youtubeDirectBtn').addEventListener('click', () => {
      collapseAllDrawers();
      if (youtubeLiveList.length > 0) {
        manualOverrideActive = true;
        loadMedia(youtubeLiveList[0].url, 'iframe', 0, youtubeLiveList[0]);
      }
    });

    const liveTvBtn = document.getElementById('liveTvToggle');
    const liveTvDrawer = document.getElementById('liveTvDrawer');
    liveTvBtn.addEventListener('click', () => {
      liveTvDrawer.classList.toggle('open');
    });

    function collapseAllDrawers() {
      liveTvDrawer.classList.remove('open');
    }

    // Initialize (fetchSchedule and other engine functions remain the same)
    // Removed all search bar references and ticker update calls
  </script>
</body>
</html>
