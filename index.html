<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="MSTV Network offers a variety of live TV channels including music, movies, and more. Watch your favorite channels online for free.">
    <meta name="robots" content="index, follow">
  <title>m3u8 player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 20px 10px;
      background-color: #000;
      font-size: 2.5em;
      font-weight: bold;
      color: #FFD700;
    }
    .scrolling-text {
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .top-scrolling-text { background-color: #222; }
    .bottom-scrolling-text { background-color: #004080; }
    .scrolling-text p {
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 15s linear infinite;
      font-size: 1.2em;
      color: #fff;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 1280px;
      margin: 30px auto;
      padding-top: 56.25%;
      background-color: black;
    }
    #videoContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #muteToggle {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white; font-size: 1.5em;
      padding: 5px 10px; border-radius: 50%;
      cursor: pointer; z-index: 10;
    }
    #liveStamp {
      position: absolute;
      top: 10px; left: 10px;
      background-color: red; color: white;
      font-weight: bold; padding: 5px 10px;
      font-size: 0.9em; border-radius: 5px; z-index: 10;
    }
    footer {
      background-color: black; color: yellow;
      padding: 20px 10px; text-align: center; font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>MSTV NETWORK</header>

  <div class="scrolling-text top-scrolling-text">
    <p>Welcome to MSTV Network — Streaming Live 24/7 — Stay Tuned for Exclusive Content and Updates!</p>
  </div>

  <div class="video-wrapper">
    <div id="videoContainer">
      <!-- Both elements pre-defined for the engine to toggle -->
      <video id="videoElement" autoplay playsinline style="width:100%; height:100%; object-fit:cover; pointer-events:none; display:none;"></video>
      <iframe id="iframeElement" style="width:100%; height:100%; border:none; display:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
    </div>
    <span id="muteToggle">🔈</span>
    <div id="liveStamp">LIVE</div>
  </div>
    
  <div class="scrolling-text bottom-scrolling-text">
    <p>Loading schedule...</p>
  </div>

  <footer>
    <div class="copyright">© 2025 MSTV INDIA. All rights reserved.</div>
  </footer>
<!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const container = document.getElementById('videoContainer');
    const muteToggle = document.getElementById('muteToggle');
    const bottomScrollText = document.querySelector('.bottom-scrolling-text p');

    let playlist = [];
    let titles = [];
    let videoDurations = [];
    let streamTypes = [];
    let totalDuration = 0;
    
    let hls = null;
    let currentIndex = -1;
    let isMuted = true;
    let currentUrl = '';
    let currentType = '';
    let currentTimeOffset = 0;

    muteToggle.textContent = '🔈';
    muteToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      muteToggle.textContent = isMuted ? '🔈' : '🔊';
      
      const activeVideo = container.querySelector('video');
      if (activeVideo) {
        activeVideo.muted = isMuted;
        if (!activeVideo.paused) activeVideo.play().catch(() => {});
      }

      if (currentType === 'iframe' && currentUrl) {
        loadMedia(currentUrl, currentType, currentTimeOffset);
      }
    });

    async function fetchSchedule(isInitial = false) {
      try {
        const response = await fetch(`test.json?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        if (!data.playlist || data.playlist.length === 0) throw new Error('Playlist is empty');
        
        playlist = data.playlist.map(item => item.stream_url);
        titles = data.playlist.map(item => item.title);
        videoDurations = data.playlist.map(item => item.duration_seconds);
        streamTypes = data.playlist.map(item => item.type || 'video');
        totalDuration = videoDurations.reduce((a, b) => a + b, 0);

        if (isInitial) {
          syncPlayback();
          setInterval(syncPlayback, 1000);
        }
      } catch (error) {
        console.error('Failed to fetch test.json:', error);
      }
    }

    function getPlaybackPosition() {
      if (totalDuration === 0) return { index: 0, time: 0 };
      const now = Math.floor(Date.now() / 1000) % totalDuration;
      let offset = 0;
      for (let i = 0; i < videoDurations.length; i++) {
        if (now < offset + videoDurations[i]) {
          return { index: i, time: now - offset };
        }
        offset += videoDurations[i];
      }
      return { index: 0, time: 0 };
    }

    // Define constants for the engine
  const SANDBOX_VALUE = "allow-scripts allow-same-origin allow-presentation allow-forms";
  const $videoEl = document.getElementById('videoElement');
  const $iframeEl = document.getElementById('iframeElement');

  function showLoader(show) {
    // Optional loader hook if needed
  }

  function showError(message) {
    console.error(message);
  }

  function isDashStream(type, url) {
    return type === 'dash' || url.includes('.mpd');
  }

  async function playDASH(url, startTime) {
    // Placeholder or integrated DASH player logic (e.g. dash.js)
    $videoEl.src = url;
    $videoEl.currentTime = startTime;
    $videoEl.play().catch(() => {});
  }

  async function playHLS(url, startTime) {
    if (hls) {
      hls.destroy();
      hls = null;
    }

    if (url.includes('.m3u8')) {
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia($videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          $videoEl.currentTime = startTime;
          $videoEl.play().catch(() => {});
        });
      } else if ($videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        $videoEl.src = url;
        $videoEl.addEventListener('loadedmetadata', () => {
          $videoEl.currentTime = startTime;
          $videoEl.play().catch(() => {});
        }, { once: true });
      }
    } else {
      $videoEl.src = url;
      $videoEl.currentTime = startTime;
      $videoEl.play().catch(() => {});
    }
  }

  // Refactored loadMedia using your engine pattern
  async function loadMedia(url, type, startTime, ch = {}) {
    if (!url) return;
    
    currentUrl = url;
    currentType = type;
    currentTimeOffset = startTime;

    // Keep track of mute property
    $videoEl.muted = isMuted;

    let streamUrl = url;
    if (type === 'iframe') {
      if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com')) {
        const muteVal = isMuted ? '1' : '0';
        if (streamUrl.includes('mute=')) {
          streamUrl = streamUrl.replace(/mute=[01]/, `mute=${muteVal}`);
        } else {
          streamUrl += (streamUrl.includes('?') ? '&' : '?') + `mute=${muteVal}`;
        }
        if (!streamUrl.includes('autoplay=')) {
          streamUrl += '&autoplay=1';
        }
      }

      // --- ENGINE CODE APPLIED HERE ---
      $videoEl.style.display = 'none';
      $iframeEl.style.display = 'block';
      if (ch.sandboxed !== false) $iframeEl.setAttribute('sandbox', SANDBOX_VALUE);
      else $iframeEl.removeAttribute('sandbox');
      
      $iframeEl.src = streamUrl;
      $iframeEl.onload = () => showLoader(false);
      $iframeEl.onerror = () => showError('iFrame error');

    } else if (isDashStream(type, streamUrl)) {
      // --- ENGINE CODE APPLIED HERE ---
      $iframeEl.style.display = 'none';
      $videoEl.style.display = 'block';
      // Clear iframe source to stop background audio/processes
      $iframeEl.src = ''; 
      await playDASH(streamUrl, startTime);
    } else {
      // --- ENGINE CODE APPLIED HERE ---
      $iframeEl.style.display = 'none';
      $videoEl.style.display = 'block';
      // Clear iframe source to stop background audio/processes
      $iframeEl.src = '';
      await playHLS(streamUrl, startTime);
    }
  }

    function updateBottomScrollText(index) {
      const nowPlaying = titles[index] || "Unknown";
      const comingNext = titles[(index + 1) % titles.length] || "Unknown";
      bottomScrollText.textContent = `Now Playing: ${nowPlaying} — Coming Next: ${comingNext}`;
    }

    function syncPlayback() {
      if (totalDuration === 0) return;
      const { index, time } = getPlaybackPosition();

      if (index !== currentIndex) {
        currentIndex = index;
        loadMedia(playlist[index], streamTypes[index], time);
        updateBottomScrollText(index);
        return;
      }

      const activeVideo = container.querySelector('video');
      if (activeVideo && Math.abs(activeVideo.currentTime - time) > 3) {
        activeVideo.currentTime = time;
      }
    }

    async function initPlayer() {
      await fetchSchedule(true);
      setInterval(() => {
        fetchSchedule(false);
      }, 10000);
    }

    initPlayer();
  </script>
</body>
</html>
